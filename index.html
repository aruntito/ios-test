<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7"><meta name="description" content="Pocket Tasks — a small interactive iOS-inspired task manager preview.">
<title>Pocket Tasks — iOS Preview</title>
<style>
:root{color-scheme:light;--bg:#f2f2f7;--card:#fff;--ink:#17171c;--muted:#85858f;--accent:#6257d9;--line:#e8e8ed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.shell{max-width:520px;min-height:100svh;margin:auto;padding:env(safe-area-inset-top) 22px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.nav{height:54px;display:flex;align-items:center;justify-content:flex-end}.add{border:0;background:none;color:var(--accent);font-size:29px;font-weight:300;padding:4px 8px;cursor:pointer}
.hero{padding:25px 2px 22px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:2px;color:var(--muted)}h1{font-size:36px;letter-spacing:-1.2px;line-height:1.08;margin:12px 0 15px;font-weight:750}.stats{font-size:14px;color:var(--muted);font-weight:550;display:flex;align-items:center;gap:8px}.stats span{color:var(--accent);font-size:17px}
.track{height:6px;border-radius:99px;background:#e3e2eb;margin-top:17px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .2s}
.list{display:flex;flex-direction:column;gap:10px}.task{background:var(--card);border-radius:17px;padding:17px 15px;display:flex;align-items:center;gap:13px;box-shadow:0 1px 2px #17171c08;animation:in .2s ease}.task button.check{border:0;background:none;padding:0;display:grid;place-items:center;color:#a5a5af;font-size:23px;cursor:pointer}.task.done button.check{color:var(--accent)}.task .name{font-size:15px;font-weight:570;flex:1;overflow-wrap:anywhere}.task.done .name{color:var(--muted);text-decoration:line-through}.remove{border:0;background:none;color:#b0b0b8;font-size:18px;padding:5px;cursor:pointer}.empty{padding:55px 15px;text-align:center;color:var(--muted);line-height:1.6}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}
.footer{margin-top:auto;padding-top:30px;text-align:center;color:#a0a0aa;font-size:11px;letter-spacing:.3px}
.overlay{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;justify-content:center;padding:12px}.overlay.show{display:flex}.sheet{width:min(100%,520px);background:var(--bg);border-radius:25px 25px 18px 18px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.sheet h2{font-size:19px;margin:0}.sheet button{border:0;background:none;color:var(--accent);font-size:15px;cursor:pointer}.field{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;width:100%;font:16px -apple-system,BlinkMacSystemFont,sans-serif;outline:none}.field:focus{border-color:var(--accent)}.hint{font-size:12px;color:var(--muted);margin:13px 2px 0}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes up{from{transform:translateY(25px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111116;--card:#202027;--ink:#f5f5f7;--muted:#9999a5;--line:#35353e}.track{background:#34333e}.field{background:#202027;color:var(--ink);border-color:var(--line)}}
</style></head>
<body><main class="shell">
<header class="nav"><button class="add" id="open" aria-label="Add task">＋</button></header>
<section class="hero"><div class="eyebrow">YOUR SPACE</div><h1>Today, well spent.</h1><div class="stats"><span>◉</span><div id="count">0 of 0 completed</div></div><div class="track"><div class="fill" id="progress"></div></div></section>
<section class="list" id="list" aria-live="polite"></section>
<div class="footer">POCKET TASKS · NATIVE IOS CONCEPT</div></main>
<div class="overlay" id="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheethead"><button id="cancel">Cancel</button><h2 id="sheetTitle">Add a task</h2><button id="save">Add</button></div><input class="field" id="input" placeholder="What needs doing?" maxlength="100" autocomplete="off"><p class="hint">Keep it small. You can always add more later.</p></section></div>
<script>
const KEY='pocket-tasks-preview';let tasks;
try{tasks=JSON.parse(localStorage.getItem(KEY))}catch(e){tasks=null}
if(!Array.isArray(tasks))tasks=['Explore SwiftUI','Build a native iOS app','Ship the first version'].map(title=>({id:crypto.randomUUID(),title,done:false}));
const list=document.querySelector('#list'),count=document.querySelector('#count'),progress=document.querySelector('#progress'),overlay=document.querySelector('#overlay'),input=document.querySelector('#input');
function persist(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}
function render(){let completed=tasks.filter(t=>t.done).length;count.textContent=completed+' of '+tasks.length+' completed';progress.style.width=(tasks.length?completed/tasks.length*100:0)+'%';list.innerHTML='';if(!tasks.length){list.innerHTML='<div class="empty"><b>Nothing on your list</b>Add a task and make a little progress.</div>';return}
tasks.forEach(task=>{let row=document.createElement('article');row.className='task'+(task.done?' done':'');let check=document.createElement('button');check.className='check';check.textContent=task.done?'✓':'○';check.setAttribute('aria-label',task.done?'Mark incomplete':'Mark complete');check.onclick=()=>{task.done=!task.done;persist()};let name=document.createElement('div');name.className='name';name.textContent=task.title;let del=document.createElement('button');del.className='remove';del.textContent='×';del.setAttribute('aria-label','Delete '+task.title);del.onclick=()=>{tasks=tasks.filter(t=>t.id!==task.id);persist()};row.append(check,name,del);list.append(row)})}
function close(){overlay.classList.remove('show');input.value=''}
function add(){let title=input.value.trim();if(!title)return;tasks.unshift({id:crypto.randomUUID(),title,done:false});persist();close()}
document.querySelector('#open').onclick=()=>{overlay.classList.add('show');setTimeout(()=>input.focus(),100)};document.querySelector('#cancel').onclick=close;document.querySelector('#save').onclick=add;input.addEventListener('keydown',e=>{if(e.key==='Enter')add();if(e.key==='Escape')close()});overlay.addEventListener('click',e=>{if(e.target===overlay)close()});render();
</script></body></html>
